  :root {
    --stage: #161b22;
    --ink: #eef0f6;
    --ink-dim: #a3abba;
    --ink-faint: rgba(238, 240, 246, 0.42);
    --step: #e9b3ff;
    --track: rgba(255, 255, 255, 0.16);
    --fill: #ff7a66;
    --btn: rgba(255, 255, 255, 0.08);
    --btn-hover: rgba(255, 255, 255, 0.16);
    --btn-on: rgba(255, 255, 255, 0.9);
    --btn-on-ink: #161b22;
    --focus: #8fc8ff;
    --panel: rgba(14, 18, 24, 0.78);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  /* The 3D stage is a dark render in both themes, so the overlay stays light-on-dark. */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --stage: #12161c; } }
  :root[data-theme="dark"] { --stage: #12161c; }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body { margin: 0; height: 100%; overflow: hidden; background: var(--stage); color: var(--ink);
    font-family: "Poppins", "Segoe UI", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #black { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; }

  .overlay { position: fixed; left: 0; right: 0; pointer-events: none; }
  .overlay > * { pointer-events: auto; }
  .top { top: 0; padding: calc(18px + env(safe-area-inset-top, 0px)) 24px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .brand { font-size: 14px; font-weight: 400; color: var(--ink-dim); margin: 0; pointer-events: none; }
  .brand strong { color: var(--ink); font-weight: 500; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .seg { display: inline-flex; background: var(--btn); border-radius: 999px; padding: 3px; }
  button { font: inherit; color: var(--ink); background: var(--btn); border: 0; border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer; transition: background 0.15s; }
  button:hover { background: var(--btn-hover); }
  button:focus-visible, .track:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .seg button { background: transparent; padding: 5px 12px; }
  .seg button[aria-pressed="true"] { background: var(--btn-on); color: var(--btn-on-ink); }

  .tof { position: fixed; right: 24px; bottom: calc(200px + env(safe-area-inset-bottom, 0px)); margin: 0; background: var(--panel); border-radius: 12px; padding: 12px 12px 10px; opacity: 0; transition: opacity 0.4s; pointer-events: none; }
  .tof.on { opacity: 1; }
  .tof canvas { display: block; width: 256px; height: 192px; border-radius: 4px; }
  .tof figcaption { margin-top: 8px; font-size: 12px; color: var(--ink-dim); max-width: 256px; line-height: 1.4; }
  .tof figcaption strong { color: var(--ink); font-weight: 500; display: block; }

  .bottom { bottom: 0; padding: 0 24px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .info { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 18px; pointer-events: none; }
  .caption { max-width: 38rem; text-shadow: 0 1px 12px rgba(0, 0, 0, 0.6); transition: opacity 0.35s; }
  .caption.swap { opacity: 0; }
  .logo { display: none; align-items: center; gap: 14px; margin: 0 0 14px; }
  .logo.on { display: flex; }
  .logo svg { width: 38px; height: 38px; flex: none; }
  .logo span { font-size: 30px; font-weight: 300; letter-spacing: 0.16em; color: #ffffff; line-height: 1; }
  .caption .part { margin: 0 0 6px; font-size: 13px; font-weight: 400; color: var(--fill); }
  .caption h1 { font-size: clamp(22px, 3.2vw, 34px); line-height: 1.12; font-weight: 500; letter-spacing: -0.012em; margin: 0 0 6px; }
  .caption p { margin: 0; font-size: 15px; line-height: 1.5; font-weight: 300; color: var(--ink-dim); }
  .caption .step { margin-top: 10px; font-size: 14px; font-weight: 500; color: var(--step); min-height: 1.5em; }
  .readout { font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; text-align: right; white-space: pre; text-shadow: 0 1px 10px rgba(0,0,0,0.6); }
  .bar { display: flex; align-items: center; gap: 16px; }
  #play { width: 40px; height: 40px; padding: 0; display: grid; place-items: center; flex: none; }
  #play svg { width: 16px; height: 16px; fill: currentColor; }
  .timeline { flex: 1; min-width: 0; }
  .groups { position: relative; height: 16px; font-size: 11px; color: var(--ink-faint); }
  .groups span { position: absolute; top: 0; white-space: nowrap; }
  .track { position: relative; height: 22px; cursor: pointer; touch-action: none; border-radius: 4px; }
  .track .rail { position: absolute; left: 0; right: 0; top: 9px; height: 4px; background: var(--track); border-radius: 2px; overflow: hidden; }
  .track .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--fill); }
  .track .tick { position: absolute; top: 5px; width: 2px; height: 12px; background: var(--stage); }
  .track .tick.major { top: 1px; height: 20px; width: 3px; }
  .labels { position: relative; height: 20px; margin-top: 2px; }
  .labels button { position: absolute; top: 0; background: transparent; padding: 0 2px; font-size: 11.5px; color: var(--ink-faint); border-radius: 4px; white-space: nowrap; }
  .labels button.on { color: var(--ink); }
  .labels button:hover { background: transparent; color: var(--ink); }
  .note { margin: 10px 0 0; font-size: 11.5px; color: var(--ink-faint); font-weight: 300; }
  #resumeCam[hidden], #showUi[hidden] { display: none; }
  body.clean .overlay, body.clean .tof { display: none; }
  #showUi { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); opacity: 0; transition: opacity 0.3s; }
  body.clean #showUi:hover, body.clean #showUi:focus-visible, body.clean.pointer-live #showUi { opacity: 1; }
  #tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .tag { position: absolute; left: 0; top: 0; background: var(--panel); color: var(--ink); font-size: 13px; line-height: 1.35; padding: 6px 12px; border-radius: 10px; white-space: nowrap; opacity: 0; transition: opacity 0.25s; text-align: center; }
  .tag strong { font-weight: 500; display: block; }
  .tag span { color: var(--step); font-variant-numeric: tabular-nums; }
  #clock { position: fixed; left: 50%; top: calc(60px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); margin: 0; font-size: clamp(40px, 7vw, 84px); font-weight: 300; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; text-shadow: 0 2px 24px rgba(0,0,0,0.6); opacity: 0; transition: opacity 0.4s; pointer-events: none; text-align: center; }
  #clock.on { opacity: 1; }
  #clock small { display: block; font-size: 14px; font-weight: 400; color: var(--ink-dim); letter-spacing: 0; }
  #bigTitle { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(18px, 3vw, 34px); padding: 24px; text-align: center; opacity: 0; pointer-events: none;
    background: radial-gradient(ellipse 60% 45% at 50% 50%, rgba(10, 12, 17, 0.72), rgba(10, 12, 17, 0) 100%); }
  #bigTitle p { margin: 0; font-size: clamp(26px, 4.6vw, 60px); font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.1; text-shadow: 0 2px 30px rgba(0,0,0,0.7); }
  .bt-logo { display: flex; align-items: center; gap: clamp(12px, 1.6vw, 20px); }
  .bt-logo svg { width: clamp(40px, 5vw, 64px); height: clamp(40px, 5vw, 64px); }
  .bt-logo span { font-size: clamp(30px, 4.4vw, 56px); font-weight: 300; letter-spacing: 0.16em; color: #fff; line-height: 1; }
  .caption.hidden { opacity: 0; }
  .msg { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink-dim); font-size: 15px; }
  .msg[hidden] { display: none; }
  @media (max-width: 1100px) { .labels button:not(.on) { font-size: 10px; } }
  @media (max-width: 720px) {
    .top { padding-left: 16px; padding-right: 16px; flex-direction: column; }
    .tools { justify-content: flex-start; }
    .bottom { padding-left: 16px; padding-right: 16px; }
    .info { flex-direction: column; align-items: flex-start; gap: 8px; }
    .readout { text-align: left; }
    .caption p { font-size: 14px; }
    .labels { display: none; }
    .note { display: none; }
    .tof { right: 16px; bottom: auto; top: calc(116px + env(safe-area-inset-top, 0px)); padding: 8px; }
    .tof canvas { width: 160px; height: 120px; }
    .tof figcaption { display: none; }
  }

  body.fb > *:not(#fallback) { display: none !important; }
  #fallback { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #0d1015; padding: 16px; }
  #fallback[hidden] { display: none; }
  #fallback video { width: 100%; max-height: 80vh; object-fit: contain; background: #0d1015; }
  #fallback p { margin: 0; color: var(--ink-dim); font-size: 14px; text-align: center; }
  #fallback a { color: var(--ink); }
  .bt-logo { height: clamp(38px, 5vw, 64px); width: auto; }

  .tof .legend { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 11px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .tof .legend i { flex: 1; height: 7px; border-radius: 4px; background: linear-gradient(90deg, hsl(0 95% 55%), hsl(60 95% 55%), hsl(120 95% 55%), hsl(180 95% 55%), hsl(259 95% 55%)); }

  .tof canvas[hidden] { display: none; }
  .tof figcaption { margin-top: 0; }
</style>

 * Full-screen textured quad shader
 */

		uniforms: {
			'tDiffuse': {
				value: null
			},

				value: 1.0

( function () {

	/**
 * Luminosity
 * http://en.wikipedia.org/wiki/Luminosity
 */

	const LuminosityHighPassShader = {
		shaderID: 'luminosityHighPass',
		uniforms: {
			'tDiffuse': {
				value: null
			},
			'luminosityThreshold': {
				value: 1.0
			},
			'smoothWidth': {
				value: 1.0
			},
			'defaultColor': {
				value: new THREE.Color( 0x000000 )

				value: 0.0
			}

		vertexShader: /* glsl */`

		varying vec2 vUv;

		void main() {

			vUv = uv;

			gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );

		}`,
		fragmentShader: /* glsl */`

		uniform sampler2D tDiffuse;
		uniform vec3 defaultColor;
		uniform float defaultOpacity;
		uniform float luminosityThreshold;
		uniform float smoothWidth;

		varying vec2 vUv;

		void main() {

			vec4 texel = texture2D( tDiffuse, vUv );

			vec3 luma = vec3( 0.299, 0.587, 0.114 );

			float v = dot( texel.xyz, luma );

			vec4 outputColor = vec4( defaultColor.rgb, defaultOpacity );

			float alpha = smoothstep( luminosityThreshold, luminosityThreshold + smoothWidth, v );

			gl_FragColor = mix( outputColor, texel, alpha );

		}`
	};

	THREE.LuminosityHighPassShader = LuminosityHighPassShader;

    let ph = k0 * (tx * x + ty * y);
    if (tgt.ground) ph -= f.c * AOPH * zern(Math.min(rr, 1.2), Math.atan2(y, x), tl);
    const o = (j * APW + i) * 4, tmp = [0, 0, 0];
    phaseColor(f.w > 0.02 ? ph : NaN, tmp, 0);
    apData[o] = tmp[0] * 255; apData[o + 1] = tmp[1] * 255; apData[o + 2] = tmp[2] * 255; apData[o + 3] = 255;
  }
  apTex.needsUpdate = true;
}

/* ================= frame update ================= */
let holoShown = { tgt: -1, iter: -1 }, holoMixStart = -10;
const tmpDir = V3(0, 0, 0);
function blackAt(t) {
  const tri = (a, w) => clamp01(1 - Math.abs(t - a) / w);
  return Math.max(tri(chStart('intro'), 0.45), tri(chStart('lidar'), 0.6), tri(chStart('fso'), 0.6), tri(TOTAL, 0.4), t < 0.3 ? 1 - t / 0.3 : 0);
}
function update(dt) {
  const S = evaluate(tl);
  S.ocsR = S.ocs ? ocsRoutes(S.ocs) : null;
  if (lastKey === null) lastKey = S.key;
  if (S.key !== lastKey) { frozen.set(shown); sweepStart = clock.v; lastKey = S.key; }
  computeLive(S);
  const sp = (clock.v - sweepStart) / SWEEP_DUR;
  paint(sp < 1, lerp(-72, 72, sp));

  // single-aperture beams (capability sections)
  incTube.show(0.32 * S.inc, 0.5);
  footMat.uniforms.uI.value = 0.14 * S.inc;
  let total = 0;
  for (let j = 0; j < 3; j++) {
    const tube = outTubes[j], b = S.beams[j], sprite = focusSprites[j];
    if (!b || b.w <= 0.002 || S.inc <= 0.002) { tube.mesh.visible = false; sprite.visible = false; continue; }
    let phi = b.phi, th = b.theta;
    if (S.wobble) { phi += 3.2 * S.wobble * Math.sin(5.3 * tl); th += 3.2 * S.wobble * Math.sin(4.1 * tl + 1); }
    dirFrom(phi, th, tmpDir);
    buildOut(tube, tmpDir, b.kappa, b.len || S.len, S.wobble);
    tube.show(0.36 * b.w * Math.min(1, S.inc * 1.2), S.noise);
    total += b.w;
    if (b.kappa > 0.05 && 1 / b.kappa < S.len) {
      sprite.visible = true; sprite.position.copy(C).addScaledVector(tmpDir, 1 / b.kappa);
      sprite.material.opacity = clamp01((b.kappa - 0.05) / 0.04) * b.w; const sc = 1.3 + 3 * b.kappa; sprite.scale.set(sc, sc, 1);
    } else sprite.visible = false;
  }
  redLight.intensity = 1.6 * Math.min(1.5, total) * S.inc + (S.arr ? 1.4 * S.arr.w : 0) + (S.id === 'ocs' ? 1.2 * S.ocs.fade : 0) + (S.id === 'lidar' ? 1.0 * S.lidar.fade : 0);

  // lab adaptive optics sheets
  const aoOn = S.id === 'ao';
  const aoVis = aoOn ? Math.min(seg(S.lt, 0, 0.8), 1 - seg(S.lt, 11.2, 12)) : 0;
  if (aoOn) {
    const outDir = dirFrom(S.beams[0].phi, S.beams[0].theta);
    const ex = V3(1, 0, 0).addScaledVector(outDir, -outDir.x), ez = V3(0, 0, 1).addScaledVector(outDir, -outDir.z);
    const o1 = ex.clone().normalize(), o2 = V3(0, 0, 0).crossVectors(outDir, o1).normalize();
    const sx = ex.length() * AX, sy = Math.abs(ez.dot(o2)) * AZ;
    displaceSheets(sheetsIn, 0.45, tl);
    displaceSheets(sheetsOut, 0.45 * (1 - S.aoC), tl);
    for (let i = 0; i < 9; i++) {
      let u = tl * 0.16 + i / 9; u -= Math.floor(u);
      const mIn = sheetsIn.meshes[i], mOut = sheetsOut.meshes[i];
      placeSheet(mIn, C.clone().addScaledVector(D_IN, -(1 - u) * L_IN * 0.85), IN_E1, IN_E2, D_IN, AX * COSI, AZ);
      mIn.material.uniforms.uOp.value = 0.5 * aoVis * seg(u, 0, 0.15) * (1 - seg(u, 0.9, 1)); mIn.visible = true;
      placeSheet(mOut, C.clone().addScaledVector(outDir, u * S.len * 0.85), o1, o2, outDir, sx, sy);
      mOut.material.uniforms.uOp.value = 0.5 * aoVis * seg(u, 0.03, 0.15) * (1 - seg(u, 0.85, 1)); mOut.visible = true;
    }
  } else { for (const m of sheetsIn.meshes) m.visible = false; for (const m of sheetsOut.meshes) m.visible = false; }

  // hologram screen
  if (S.holo) {
    const { tgt, iter, fade } = S.holo;
    if (tgt !== holoShown.tgt) {
      if (holoShown.tgt >= 0) { texData[0].set(texData[1]); texs[0].needsUpdate = true; holoMixStart = clock.v; }
      writeTex(1, HOLO[tgt].images[iter]); holoShown = { tgt, iter };
    } else if (iter !== holoShown.iter) { writeTex(1, HOLO[tgt].images[iter]); holoShown.iter = iter; }
    screenMat.uniforms.uMix.value = clamp01((clock.v - holoMixStart) / SWEEP_DUR);
    screenMat.uniforms.uI.value = seg(S.lt, 0.2, 1.0) * fade; screen.visible = true;
  } else { screen.visible = false; holoShown = { tgt: -1, iter: -1 }; }

  updateArray(S);
  updateOcs(S);
  updateLidar(S, dt);
  updateFso(S);
  updateSpeed(S);
  updateZoom(S);
  updateWave(S);
  emisU.value = (S.id === 'zoom' && S.zoom.d < 2) || (S.id === 'wave' && S.lt < 10) ? 0.28 : 0.5;
  freezeNoise = !!(S.speed && S.speed.freeze);
  $('#black').style.opacity = blackAt(tl);
  $('#bigTitle').style.opacity = S.id === 'cold' ? seg(S.lt, 1.0, 1.8) * (1 - seg(S.lt, 4.0, 4.45)) : 0;

  // camera
  if (autoCam) {
    const cf = camFor(S), k = cf.snap ? 1 : 1 - Math.exp(-dt * 1.3);
    camera.position.lerp(cf.pos, k); camTarget.lerp(cf.target, k);
    if (Math.abs(camera.fov - cf.fov) > 0.05) { camera.fov = lerp(camera.fov, cf.fov, k); camera.updateProjectionMatrix(); }
    camera.lookAt(camTarget); controls.target.copy(camTarget);
  } else controls.update();
  // near/far follow the zoom so a 10,000x change in scale renders cleanly
  const dist = camera.position.distanceTo(camTarget);
  const wantNear = S.id === 'zoom' ? Math.max(0.0004, dist * 0.02) : 0.1, wantFar = S.id === 'zoom' ? Math.max(3000, dist * 40) : 2500;
  if (camera.near !== wantNear || camera.far !== wantFar) { camera.near = wantNear; camera.far = wantFar; camera.updateProjectionMatrix(); }
  dome.position.copy(camera.position); dome.scale.setScalar(camera.far * 0.9 / 900);
  flushTags();
  updateCaption(S);
}

let freezeNoise = false, k0Hidden = false;
function updateSpeed(S) {
  const on = S.id === 'speed'; spGroup.visible = on;
  const clk = $('#clock'); clk.classList.toggle('on', on && S.speed.bullet);
  if (!on) { gimBeam.mesh.visible = false; memsIn.mesh.visible = false; return; }
  const sp = S.speed, lt = S.lt;
  if (lt < 0.85) { hitL.fill(-99); hitG.fill(-99); }
  if (sp.lcmHit >= 0) hitL[sp.lcmHit] = lt;
  if (sp.gimHit >= 0) hitG[sp.gimHit] = lt;
  for (let i = 0; i < 20; i++) for (const [arr, wall] of [[hitL, wallL], [hitG, wallG]]) {
    const b = Math.exp(-Math.max(0, lt - arr[i]) / 0.9);
    wall.dots[i].material.color.setRGB(lerp(0.16, 1.0, b), lerp(0.18, 0.55, b), lerp(0.22, 0.45, b));
  }
  const [ma, mb] = sp.mems; yoke.rotation.x = mb; head.rotation.z = ma;
  const nrm = memsNormal(ma, mb), d = D_M.clone().addScaledVector(nrm, -2 * D_M.dot(nrm)).normalize();
  const O = GIM_O.clone(), T = O.clone().addScaledVector(d, wallG.mid.clone().sub(O).dot(SP_W) / Math.max(0.2, d.dot(SP_W)));
  const e1 = V3(0, 0, 0).crossVectors(d, V3(1, 0, 0)).normalize(), e2 = V3(0, 0, 0).crossVectors(e1, d), dv = T.clone().sub(O);
  gimBeam.build((s, a, v) => v.copy(O).addScaledVector(dv, s).addScaledVector(e1, Math.cos(a) * 0.6).addScaledVector(e2, Math.sin(a) * 0.6));
  const tagOp = 1 - seg(lt, 6.8, 7.4);
  gimBeam.show(0.4 * (0.3 + 0.7 * tagOp), 0.3); memsIn.show(0.3 * (0.3 + 0.7 * tagOp), 0.3);
  tagQueue.push(['g', '<strong>2-axis MEMS mirror</strong><span>' + sp.gCount + (sp.gCount === 1 ? ' target' : ' targets') + '</span>', wallG.top, tagOp]);
  tagQueue.push(['l', '<strong>LCM, no moving parts</strong><span>' + sp.lcmCount + (sp.lcmCount === 1 ? ' target' : ' targets') + '</span>', wallL.top, tagOp]);
  if (sp.bullet) { const us = (50 * sp.u).toFixed(1); if (clk.dataset.v !== us) { clk.dataset.v = us; clk.innerHTML = us + ' \u00b5s<small>one pattern rewrite</small>'; } }
}
function updateZoom(S) {
  const on = S.id === 'zoom', z = S.zoom;
  world.visible = on && z.d > 9;
  mol.visible = on && z.d < 0.42;
  const hide = mol.visible;
  if (hide !== k0Hidden) {
    k0Hidden = hide; zm.makeScale(hide ? 1e-4 : 1, hide ? 1e-4 : 1, hide ? 1e-4 : 1); zm.setPosition(PX[K0] * PITCH, TOP - 0.035, PZ[K0] * PITCH);
    P1.mesh.setMatrixAt(K0, zm); P1.mesh.instanceMatrix.needsUpdate = true;
  }
  if (floor.material.transparent !== on) { floor.material.transparent = on; floor.material.needsUpdate = true; } floor.material.opacity = on ? 1 - seg(z.d, 10, 26) : 1; floor.material.depthWrite = !on || z.d < 10; floor.visible = !(on && z.d > 26);
  const wop = on ? seg(S.lt, 3.0, 4.0) * (1 - seg(S.lt, 8.6, 9.6)) : 0;
  wvMesh.visible = wop > 0.002;
  if (!on) { robotFan.mesh.visible = satBeam.mesh.visible = false; return; }
  if (mol.visible) updateMol(z.V, tl, 1 - seg(z.d, 0.25, 0.42));
  if (wvMesh.visible) updateWavelets(tl, wop, dirFrom(30, 15));
  if (world.visible) updateWorld(tl, seg(z.d, 60, 220));
  const top = seg(S.lt, 13.4, 14.4);
  tagQueue.push(['zl', '<strong>Lidar</strong>', V3(0, 34, 0), top]);
  tagQueue.push(['zo', '<strong>Optical circuit switching</strong>', V3(520, WFY + 450, -140), top]);
  tagQueue.push(['zf', '<strong>Free-space optical comms</strong>', wSat.position.clone().add(V3(0, -75, 0)), top]);
}

/* ================= start ================= */
function start() {
  HOLO = TARGETS.map((T, i) => runGS(makeTarget(T.draw), 101 + i));
  resize();
  // compile every shader up front so section changes do not hitch
  const vis = []; scene.traverse(o => { vis.push([o, o.visible]); o.visible = true; });
  try { renderer.compile(scene, camera); } catch (e) {}
  for (const [o, v] of vis) o.visible = v;
  $('#loading').hidden = true;
  const S0 = evaluate(tl), c0 = camFor(S0); camera.position.copy(c0.pos); camTarget.copy(c0.target); camera.lookAt(camTarget);
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (playing) { tl += dt; if (tl >= TOTAL) tl -= TOTAL; }
    clock.v += dt * (freezeNoise ? 0.02 : 1); update(dt); composer.render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.lcm = { seek, play: () => setPlaying(true), pause: () => setPlaying(false), duration: TOTAL, step(dt) { tl = Math.min(TOTAL - 0.001, tl + dt); clock.v += dt; update(dt); composer.render(); } };
}
setTimeout(start, 30);
})();

</script>
