name: Publish container images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: Derive tag
        id: meta
        run: echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:sha-${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push PocketBase image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.pocketbase
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/pb:sha-${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ github.repository }}/pb:latest
          cache-from: type=gha,scope=pb
          cache-to: type=gha,mode=max,scope=pb

      - name: Summarize published images
        env:
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          echo "### Published images" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/${GITHUB_REPOSITORY}/web:sha-${SHORT_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/${GITHUB_REPOSITORY}/pb:sha-${SHORT_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: publish
    if: >-
      github.ref == 'refs/heads/main'
      && vars.DOKPLOY_PB_APP_ID != ''
      && vars.DOKPLOY_WEB_APP_ID != ''
    runs-on: ubuntu-latest
    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      PB_APP: ${{ vars.DOKPLOY_PB_APP_ID }}
      WEB_APP: ${{ vars.DOKPLOY_WEB_APP_ID }}
      TAG: sha-${{ needs.publish.outputs.short_sha }}

    steps:
      - name: Deploy PocketBase, then the web app
        run: |
          set -euo pipefail
          # GHCR rejects a mixed-case path, and an organisation name is free to have capitals.
          IMAGE_BASE=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          dk() { npx -y @dokploy/cli@0.3.0 "$@"; }
          api() { curl -sS -H "x-api-key: $DOKPLOY_API_KEY" "$DOKPLOY_URL/api/$1"; }
          wait_done() {
            for _ in $(seq 60); do
              status=$(api "application.one?applicationId=$1" | jq -r .applicationStatus)
              [ "$status" = done ] && return 0
              [ "$status" = error ] && { echo "deploy failed: $1"; return 1; }
              sleep 5
            done
            echo "timed out waiting for $1"; return 1
          }

          for pair in "pb $PB_APP" "web $WEB_APP"; do
            set -- $pair
            dk application update --applicationId "$2" --dockerImage "$IMAGE_BASE/$1:$TAG"
            dk application deploy --applicationId "$2" --title "ci $TAG"
            wait_done "$2"
          done

          host=$(api "domain.byApplicationId?applicationId=$WEB_APP" | jq -r '.[0].host')
          curl -fsS -o /dev/null -w "https://$host -> %{http_code}\n" "https://$host/"
