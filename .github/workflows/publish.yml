name: Publish container images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Validate configuration and derive tag
        id: meta
        env:
          PUBLIC_PB_URL: ${{ vars.PUBLIC_PB_URL }}
        run: |
          if [ -z "$PUBLIC_PB_URL" ]; then
            echo "::error::Repository variable PUBLIC_PB_URL must be set before publishing images."
            exit 1
          fi
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            PUBLIC_PB_URL=${{ vars.PUBLIC_PB_URL }}
          tags: |
            ghcr.io/${{ github.repository }}/web:sha-${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push PocketBase image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.pocketbase
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/pb:sha-${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ github.repository }}/pb:latest
          cache-from: type=gha,scope=pb
          cache-to: type=gha,mode=max,scope=pb

      - name: Summarize published images
        env:
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          echo "### Published images" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/${GITHUB_REPOSITORY}/web:sha-${SHORT_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/${GITHUB_REPOSITORY}/pb:sha-${SHORT_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
